<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0 text-dark">Reportes Profesionales</h4>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item small"><a routerLink="/dashboard" class="text-decoration-none text-muted">Dashboard</a></li>
        <li class="breadcrumb-item small active" aria-current="page">Reportes</li>
      </ol>
    </nav>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="row g-3">
        <ng-container *ngFor="let group of groups">
          <div class="col-12">
            <h6 class="text-muted text-uppercase fw-bold small mb-2">{{ group }}</h6>
          </div>
          <div class="col-sm-6 col-xl-4" *ngFor="let option of optionsFor(group)">
            <button
              type="button"
              class="card report-card w-100 text-start border-0 shadow-sm p-3"
              [class.selected]="selectedType === option.value"
              [disabled]="option.value === 'audit' && !(currentUser()?.role === 'admin')"
              (click)="selectReport(option.value)"
            >
              <div class="d-flex justify-content-between align-items-start">
                <h6 class="fw-bold mb-1">{{ option.label }}</h6>
                <i class="bi bi-check-circle-fill text-primary" *ngIf="selectedType === option.value"></i>
              </div>
              <p class="small text-muted mb-0">{{ option.description }}</p>
            </button>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card border-0 shadow-sm sticky-top" style="top: 20px; z-index: 10;">
        <div class="card-header bg-white py-3 border-0">
          <h6 class="mb-0 fw-bold text-secondary">Generar Reporte</h6>
        </div>
        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Formato de salida</label>
            <select class="form-select form-select-sm bg-light" [(ngModel)]="selectedFormat">
              <option *ngFor="let format of formats" [ngValue]="format.value">{{ format.label }}</option>
            </select>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Desde</label>
              <input type="date" class="form-control form-control-sm bg-light" [(ngModel)]="dateFrom">
            </div>
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Hasta</label>
              <input type="date" class="form-control form-control-sm bg-light" [(ngModel)]="dateTo">
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Mes (presupuesto)</label>
              <input type="number" min="1" max="12" class="form-control form-control-sm bg-light" [(ngModel)]="month">
            </div>
            <div class="col-6">
              <label class="form-label small fw-bold text-muted">Año (presupuesto)</label>
              <input type="number" class="form-control form-control-sm bg-light" [(ngModel)]="year">
            </div>
          </div>

          <div class="alert alert-info small mb-3" *ngIf="selectedType === 'planning'">
            El reporte de presupuesto usa el mes y año indicados.
          </div>
          <div class="alert alert-warning small mb-3" *ngIf="selectedType === 'audit' && !(currentUser()?.role === 'admin')">
            Solo disponible para administradores.
          </div>

          <div *ngIf="successMsg" class="alert alert-success py-2 small mb-3">
            <i class="bi bi-check-circle-fill me-2"></i> {{ successMsg }}
          </div>
          <div *ngIf="errorMsg" class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMsg }}
          </div>

          <button type="button" class="btn btn-sm btn-primary w-100 py-2 shadow-sm" (click)="exportReport()" [disabled]="exporting || !canExportAudit()">
            <span *ngIf="!exporting"><i class="bi bi-download me-2"></i> Exportar {{ selectedType }} en {{ selectedFormat.toUpperCase() }}</span>
            <span *ngIf="exporting" class="spinner-border spinner-border-sm me-2"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
